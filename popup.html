<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artur4ik Proxy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <div class="bg-stage">
      <div class="bg-layer bg-a"></div>
      <div class="bg-layer bg-b"></div>
      <div class="bg-overlay"></div>
    </div>

    <div class="content">
      <header class="topbar">
        <div class="brand" aria-label="Artur4ik Proxy">
          <span class="brand-kicker">proxy</span>
          <span class="brand-name">Artur4ik</span>
        </div>
        <div id="statusBadge" class="status-badge off">Отключено</div>
      </header>

      <div class="bottom-panel">
        <p id="statusText" class="status-text">Не тревожьте Артурчика и подключитесь наконец-то</p>

        <button id="toggleBtn" class="toggle-btn off">
          <span id="toggleBtnText">Подключить</span>
        </button>

        <div id="messageBox" class="message hidden"></div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
